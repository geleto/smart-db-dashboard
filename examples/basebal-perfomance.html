							<p class="text-muted small mb-3">Summarizes changes in team wins, runs scored, and runs allowed across historical eras.</p>


<ul>
  <li>Average wins rose from <strong>25.59 per team-season in the 1870s</strong> to around 75–81 from the 1900s onward; the highest shown is <strong>80.99 in the 2010s</strong>.</li>
  <li>Scoring peaked among these decades in the <strong>1890s at 811.07 runs</strong> per team-season, then fell to about 594 in the 1900s and 1910s.</li>
  <li>Runs scored climbed to <strong>770.61 in the 2000s</strong>, then eased to 710.73 in the 2010s.</li>
  <li>Average runs allowed closely match runs scored in every decade. These aggregate figures therefore show little separation between eras on that measure; they do not identify standout teams or seasons.</li>
  <li>The 2020s excerpt has only <strong>90 team-seasons</strong> and averages 63.97 wins, so it is incomplete and not directly comparable to full decades.</li>
</ul>

<ul>
  <li><strong>Boston Red Stockings, 1875</strong>, top this excerpt at a .899 winning percentage (71–8) and scored 831 runs.</li>
  <li>The St. Louis Maroons’ 1884 season ranks second at .832 (94–19), with the excerpt’s highest run total: 887.</li>
  <li>Chicago appears three times among the listed leaders, including the 1906 Cubs, who recorded the most wins shown: 116 (116–36) at .763.</li>
  <li>The listed seasons span 1871–1906; these results show standout records in the excerpt, but do not establish how performance changed across all eras.</li>
</ul>
